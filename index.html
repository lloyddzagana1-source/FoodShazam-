<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Shazam - AI Food Recognition</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f9fa; color: #333; }
    header { background: #28a745; color: white; text-align: center; padding: 60px 20px; }
    header h1 { font-size: 2.5em; margin: 0; }
    header p { font-size: 1.2em; margin: 10px 0 0; }
    nav { background: #218838; text-align: center; padding: 10px; }
    nav a { color: white; margin: 0 15px; text-decoration: none; font-size: 1em; }
    .upload-section { text-align: center; padding: 40px 20px; }
    .upload-btn { background: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; }
    .result { text-align: center; padding: 20px; font-size: 1.2em; }
    footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 40px; }
    footer a { color: #aaa; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>🍎 Food Shazam</h1>
    <p>AI-powered food recognition and nutrition tracking</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>
  <div class="upload-section">
    <h2>Upload a food photo</h2>
    <p>Take or upload a photo and we'll identify the food!</p>
    <label for="food-input">
      <div class="upload-btn">📷 Choose Photo</div>
    </label>
    <input type="file" id="food-input" accept="image/*" style="display:none">
  </div>
  <div class="result" id="result"></div>
  <footer>
    <p>© 2026 Food Shazam. All Rights Reserved.</p>
    <p><a href="privacy.html">Privacy Policy</a> | <a href="about.html">About</a></p>
  </footer>
</body>
</html>
